[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "distdna"
version = "0.1.0"
description = "Reproducible exact-MMD and RFFTrace experiments for stochastic LLM representations"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]
embedding = ["sentence-transformers>=2.2.2"]
local = [
  "accelerate==1.14.0",
  "huggingface-hub==1.24.0",
  "sentence-transformers==5.6.1",
  "torch==2.13.0",
  "transformers==5.14.1",
]

[project.scripts]
distdna = "distdna.cli:main"
calc-rfftrace = "distdna.cli:main_calc_rfftrace"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
